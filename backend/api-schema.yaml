openapi: 3.0.3
info:
  title: ISP Manager API
  version: 1.0.0
  description: |-
    ISP 管理系统后端 API 文档

    ## 认证方式
    所有接口（除 `/api/auth/token/` 及文档接口外）均需在请求头中携带 JWT Token：

    ```
    Authorization: Bearer <access_token>
    ```

    ## 获取 Token
    调用 `POST /api/auth/token/`，传入 `username` 和 `password`，返回 `access` 和 `refresh` 两个 token。

    ## 模块说明
    - **认证（auth）**：登录、Token 刷新、用户信息、修改密码
    - **客户管理（customer）**：客户、联系记录、合同、账单、操作日志
    - **资源管理（resource）**：地理位置、运营商、POP点、网络接口、路由、IP、VPS、边缘加速、带宽
    - **服务管理（service）**：套餐、工单、服务实例、分配记录、变更申请、操作日志
paths:
  /api/auth/token/:
    post:
      operationId: auth_token_create
      description: |-
        使用用户名和密码登录，返回 JWT access/refresh token 及当前用户信息。

        **后续所有 API 请求须在 Header 中携带：**
        ```
        Authorization: Bearer <access_token>
        ```
      summary: 用户登录
      tags:
      - 认证
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequestRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/LoginRequestRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/LoginRequestRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
          description: ''
        '401':
          description: 用户名或密码错误
  /api/auth/token/refresh/:
    post:
      operationId: auth_token_refresh_create
      description: |-
        Takes a refresh type JSON web token and returns an access type JSON web
        token if the refresh token is valid.
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenRefreshRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TokenRefreshRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TokenRefreshRequest'
        required: true
      security:
      - BearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenRefresh'
          description: ''
  /api/auth/token/verify/:
    post:
      operationId: auth_token_verify_create
      description: |-
        Takes a token and indicates if it is valid.  This view provides no
        information about a token's fitness for a particular use.
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenVerifyRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TokenVerifyRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TokenVerifyRequest'
        required: true
      security:
      - BearerAuth: []
      responses:
        '200':
          description: No response body
