# ISPmanager 反代公共头（由部署脚本安装到 /etc/nginx/snippets/ispmanager-proxy.conf）
# $http_host 保留浏览器 Host（含 :30090）；$host 会丢掉端口，导致 Admin CSRF 403
proxy_set_header Host              $http_host;
proxy_set_header X-Real-IP         $remote_addr;
proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Forwarded-Host  $http_host;
proxy_set_header X-Forwarded-Port  $server_port;
# 门户通道头只由门户 API 端口写入。公网入口清掉，避免浏览器自行声明。
proxy_set_header X-ISP-Portal-Channel "";
proxy_set_header X-ISP-Portal-Key "";
proxy_redirect off;
